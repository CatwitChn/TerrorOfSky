<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terror of Sky 的 MiG-23M 与 F-4E 正俯视导弹训练。">
  <title>Terror of Sky · 导弹训练</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eff4f0;
      --muted: #bacbc9;
      --accent: #f7cb6b;
      --glass: rgb(11 28 34 / 91%);
      --border: rgb(199 227 219 / 25%);
      --gutter: clamp(14px, 2.6vw, 40px);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; color: var(--ink); background: #123943; }
    button, select { font: inherit; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    button:disabled, select:disabled { opacity: .55; }

    .game, .scene, .vignette, .effects { position: fixed; inset: 0; width: 100%; height: 100%; }
    .game { isolation: isolate; }
    .scene { display: block; }
    .effects { pointer-events: none; }
    .vignette {
      pointer-events: none;
      background:
        linear-gradient(180deg, rgb(3 16 22 / 61%), transparent 22%, transparent 77%, rgb(5 20 27 / 53%)),
        radial-gradient(ellipse at 52% 52%, transparent 53%, rgb(4 15 23 / 23%));
    }

    .topbar, .bottom-bar {
      position: absolute;
      left: var(--gutter);
      right: var(--gutter);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: start;
      pointer-events: none;
    }
    .topbar { top: clamp(14px, 3vh, 28px); }
    .bottom-bar { bottom: clamp(14px, 3.4vh, 33px); gap: 10px; align-items: end; }

    .identity { display: grid; gap: 7px; justify-items: start; }
    .identity h1 {
      margin: 0;
      font-size: clamp(19px, 2vw, 28px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: .12em;
      white-space: nowrap;
      text-shadow: 0 2px 9px rgb(0 13 19 / 75%);
    }
    .aircraft-select {
      min-height: 31px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent);
      background: var(--glass);
      font-size: .875rem;
      font-weight: 650;
      pointer-events: auto;
      cursor: pointer;
    }

    .compass { position: relative; display: grid; justify-items: center; gap: 5px; min-width: 145px; }
    .compass-scale {
      position: relative;
      width: clamp(124px, 17vw, 235px);
      height: 14px;
      background-image:
        repeating-linear-gradient(90deg, rgb(232 246 236 / 62%) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(90deg, #e8f6ec 0 1px, transparent 1px 36px);
      background-position: var(--tape-offset, 0) 0;
      background-size: auto 6px, auto 11px;
      background-repeat: no-repeat;
      mask-image: linear-gradient(90deg, transparent, black 20% 80%, transparent);
    }
    .compass-scale::after {
      position: absolute;
      top: 0;
      left: calc(50% - 1px);
      width: 2px;
      height: 14px;
      content: "";
      background: var(--accent);
    }
    .compass-reading {
      display: flex;
      gap: 7px;
      align-items: baseline;
      color: var(--muted);
      font-size: .875rem;
      text-shadow: 0 1px 5px #0b2228;
    }
    .compass-reading output { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .missile-feedback {
      position: absolute;
      top: calc(100% + 7px);
      color: var(--accent);
      font-size: .875rem;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 1px 5px #0b2228;
    }
    .missile-feedback[data-danger] { color: #ff9c86; }

    .actions { display: flex; justify-self: end; gap: 6px; pointer-events: auto; }
    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--ink);
      background: var(--glass);
      font-size: .875rem;
      font-weight: 550;
      white-space: nowrap;
      cursor: pointer;
    }
    .button:enabled:hover, .aircraft-select:enabled:hover { border-color: var(--accent); }
    .icon { position: relative; flex: 0 0 auto; width: 13px; height: 13px; }
    .icon-pause { width: 10px; height: 11px; border-left: 3px solid; border-right: 3px solid; }
    .icon-play { width: 0; height: 0; border: 6px solid transparent; border-left: 9px solid; border-right: 0; }
    .icon-reset { border: 1.5px solid currentColor; border-left-color: transparent; border-radius: 50%; }
    .icon-reset::after {
      position: absolute;
      top: 0;
      left: -2px;
      content: "";
      border: 3px solid transparent;
      border-right-color: currentColor;
      transform: rotate(-32deg);
    }

    .instrument {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--glass);
      box-shadow: 0 5px 20px rgb(1 15 21 / 22%);
    }
    .telemetry {
      display: grid;
      grid-template-columns: auto auto;
      gap: 9px clamp(12px, 2.1vw, 24px);
      justify-self: start;
      padding: 10px clamp(9px, 1.5vw, 15px) 8px;
    }
    .gauge { display: grid; align-content: start; gap: 5px; }
    .gauge-label { color: var(--muted); font-size: .75rem; }
    .reading {
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
      line-height: 1;
    }
    .reading output { font-size: clamp(1.25rem, 2.65vw, 1.875rem); font-weight: 650; font-variant-numeric: tabular-nums; }
    .reading span { font-size: .75rem; color: var(--muted); }
    .throttle-track {
      position: relative;
      height: 4px;
      margin-top: 2px;
      overflow: hidden;
      border-radius: 2px;
      background: rgb(202 231 226 / 22%);
    }
    .throttle-track::after {
      position: absolute;
      inset: 0;
      content: "";
      background: var(--accent);
      transform: scaleX(var(--throttle, .55));
      transform-origin: left;
    }
    .telemetry-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding-top: 5px;
      border-top: 1px solid var(--border);
    }
    .telemetry-row output { font-size: .8125rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .telemetry-row output[data-empty] { color: var(--accent); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 18px);
      padding: 9px 12px;
      white-space: nowrap;
    }
    .control-group { display: flex; align-items: center; gap: 4px; }
    .control-group span { margin-left: 3px; color: var(--muted); font-size: .875rem; }
    kbd {
      display: inline-grid;
      min-width: 21px;
      height: 22px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--ink);
      background: rgb(210 236 228 / 8%);
      font-family: inherit;
      font-size: .8125rem;
      font-weight: 650;
    }
    kbd.active { color: #152526; border-color: var(--accent); background: var(--accent); }
    kbd[data-key="Space"] { padding-inline: 5px; }

    .minimap { width: clamp(116px, 19vw, 210px); justify-self: end; overflow: hidden; }
    .minimap-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      padding: 5px 7px;
      font-size: .75rem;
      white-space: nowrap;
    }
    .minimap-north { color: var(--muted); }
    .minimap-status { color: var(--accent); }
    .minimap-view { position: relative; border-top: 1px solid var(--border); background: #163639; }
    .minimap-terrain { display: block; width: 100%; height: auto; }
    .minimap-marker, .minimap-target {
      position: absolute;
      left: clamp(10px, var(--map-x, 50%), calc(100% - 10px));
      top: clamp(10px, var(--map-z, 50%), calc(100% - 10px));
    }
    .minimap-target {
      width: 8px;
      height: 8px;
      border: 1px solid #ffae79;
      background: #342c2b;
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .minimap-marker {
      width: 14px;
      height: 17px;
      transform: translate(-50%, -50%) rotate(var(--map-heading, 0rad));
      filter: drop-shadow(0 1px 2px #081418);
    }
    .minimap-marker::after {
      display: block;
      height: 100%;
      content: "";
      background: var(--accent);
      clip-path: polygon(50% 0, 100% 100%, 50% 77%, 0 100%);
    }

    .message-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(3 15 19 / 42%);
    }
    .message-overlay[hidden] { display: none; }
    .message-panel { width: min(100%, 320px); padding: 26px; text-align: center; }
    .message-panel h2 { margin: 0; font-size: 1.45rem; }
    .message-panel p { margin: 10px 0 0; color: var(--muted); line-height: 1.5; }
    .message-panel .button { margin-top: 18px; padding-inline: 16px; color: #1a2322; background: var(--accent); }
    .message-panel .button[hidden] { display: none; }

    @media (max-width: 700px) {
      .topbar { grid-template-columns: 1fr auto; gap: 12px; }
      .identity { grid-area: 1 / 1; }
      .actions { grid-area: 1 / 2; }
      .compass { grid-column: 1 / -1; justify-self: center; }
    }
    @media (max-width: 640px) {
      .compass { grid-area: 2 / 1; min-width: 0; justify-self: start; }
      .bottom-bar { grid-template-columns: 1fr auto; }
      .telemetry { grid-area: 1 / 1; }
      .minimap { grid-area: 1 / 2; }
      .controls { grid-area: 2 / 1 / 3 / -1; justify-self: center; padding: 6px 8px; }
      .control-group { gap: 3px; }
      .control-group span { margin-left: 2px; font-size: .75rem; }
      .controls kbd { min-width: 18px; height: 21px; font-size: .75rem; }
    }
    @media (max-width: 640px) and (max-height: 420px) {
      .controls { display: none; }
    }
    @media (max-width: 380px) {
      .identity h1 { font-size: clamp(16px, 5vw, 19px); letter-spacing: .055em; }
      .actions .button { padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="导弹训练对战">
    <canvas class="scene" id="scene" role="img" aria-label="正俯视的海岸对战区域"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <canvas class="effects" id="effects" aria-hidden="true"></canvas>

    <header class="topbar">
      <div class="identity">
        <h1>TERROR OF SKY</h1>
        <select class="aircraft-select" id="aircraft-select" aria-label="对战机型" disabled>
          <option value="0">MiG-23M</option>
          <option value="1">F-4E</option>
        </select>
      </div>
      <div class="compass" id="compass">
        <div class="compass-scale" aria-hidden="true"></div>
        <div class="compass-reading">航向 <output id="heading" aria-live="off">000°</output></div>
        <span class="missile-feedback" id="missile-feedback" role="status"></span>
      </div>
      <div class="actions">
        <button class="button" id="pause" type="button" aria-keyshortcuts="Escape">
          <i class="icon icon-pause" aria-hidden="true"></i><span>暂停</span>
        </button>
        <button class="button" id="reset" type="button" aria-keyshortcuts="R">
          <i class="icon icon-reset" aria-hidden="true"></i><span>重置</span>
        </button>
      </div>
    </header>

    <footer class="bottom-bar">
      <div class="instrument telemetry" aria-label="飞行仪表">
        <div class="gauge">
          <label class="gauge-label" for="speed">空速</label>
          <div class="reading"><output id="speed" aria-live="off">695</output><span>km/h</span></div>
        </div>
        <div class="gauge">
          <label class="gauge-label" for="throttle">油门</label>
          <div class="reading"><output id="throttle" aria-live="off">55</output><span>%</span></div>
          <div class="throttle-track" id="throttle-track" aria-hidden="true"></div>
        </div>
        <div class="telemetry-row">
          <label class="gauge-label" for="bank-angle">侧滚</label><output id="bank-angle" aria-live="off">0°</output>
        </div>
        <div class="telemetry-row">
          <label class="gauge-label" id="missile-name" for="missile-ammo">R-60</label><output id="missile-ammo" aria-live="off">2 枚</output>
        </div>
        <div class="telemetry-row">
          <label class="gauge-label" for="seeker-status">红外引导</label><output id="seeker-status" aria-live="off">待机</output>
        </div>
      </div>
      <div class="instrument controls" aria-label="飞行按键">
        <div class="control-group"><kbd data-key="KeyW">W</kbd><kbd data-key="KeyS">S</kbd><span>油门</span></div>
        <div class="control-group"><kbd data-key="KeyA">A</kbd><kbd data-key="KeyD">D</kbd><span>转向</span></div>
        <div class="control-group"><kbd data-key="Space">空格</kbd><span>引导 / 发射</span></div>
      </div>
      <div class="instrument minimap" role="group" aria-label="北向朝上的小地图，黄色箭头为本机，橙色菱形为对手">
        <div class="minimap-header">
          <span id="minimap-name">海岸</span>
          <span class="minimap-status" id="minimap-status" role="status"></span>
          <span class="minimap-north" aria-hidden="true">↑ N</span>
        </div>
        <div class="minimap-view" aria-hidden="true">
          <canvas class="minimap-terrain" id="minimap-terrain" width="384" height="288"></canvas>
          <span class="minimap-target" id="minimap-target"></span>
          <span class="minimap-marker" id="minimap-marker"></span>
        </div>
      </div>
    </footer>

    <div class="message-overlay" id="message" hidden>
      <section class="instrument message-panel" role="dialog" aria-labelledby="message-title" aria-describedby="message-detail">
        <h2 id="message-title"></h2>
        <p id="message-detail" hidden></p>
        <button class="button" id="resume" type="button">继续训练</button>
      </section>
    </div>
  </main>

  <script id="terrain-fragment" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;

    uniform vec2 uResolution;
    uniform vec4 uView;
    uniform float uTime;
    out vec4 pixel;

    const vec3 SUN = vec3(-0.43, 0.85, -0.30);

    mat2 rotation(float angle) {
      float c = cos(angle);
      float s = sin(angle);
      return mat2(c, s, -s, c);
    }

    float hash(vec2 point) {
      vec3 p = fract(vec3(point.xyx) * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    float noise(vec2 p) {
      vec2 cell = floor(p);
      vec2 f = fract(p);
      vec2 w = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(cell), hash(cell + vec2(1.0, 0.0)), w.x),
                 mix(hash(cell + vec2(0.0, 1.0)), hash(cell + 1.0), w.x), w.y);
    }

    float fractalNoise(vec2 p) {
      float result = 0.0;
      float amplitude = 0.55;
      for (int i = 0; i < 4; ++i) {
        result += amplitude * noise(p);
        p = mat2(1.64, 1.19, -1.19, 1.64) * p + vec2(17.6, 9.2);
        amplitude *= 0.48;
      }
      return result;
    }

    float island(vec2 p, vec2 center, vec2 size, float angle) {
      return 1.0 - length(rotation(angle) * (p - center) / size);
    }

    float landHeight(vec2 p) {
      vec2 cell = floor((p + 90.0) / 180.0);
      float mass = -2.0;
      if (cell == vec2(0.0)) {
        mass = island(p, vec2(-46.0, -24.0), vec2(35.0, 39.0), -0.38);
        mass = max(mass, island(p, vec2(-26.0, -41.0), vec2(13.5, 21.0), 0.68));
        mass = max(mass, island(p, vec2(-24.0, -10.0), vec2(12.2, 10.2), -0.65));
        mass = max(mass, island(p, vec2(-22.0, 12.0), vec2(5.0, 10.0), -0.45));
        mass = max(mass, island(p, vec2(51.0, 24.0), vec2(17.0, 19.5), 0.72));
        mass = max(mass, island(p, vec2(31.0, 17.0), vec2(4.5, 6.3), 0.18));
        mass = max(mass, island(p, vec2(59.0, -67.0), vec2(26.0, 18.0), -0.25));
      } else {
        vec2 jitter = vec2(hash(cell), hash(cell + vec2(13.4, 7.3)));
        vec2 center = cell * 180.0 + (jitter - 0.5) * 34.0;
        mass = island(p, center, vec2(16.0 + jitter.x * 20.0, 21.0 + jitter.y * 20.0), jitter.x * 6.28);
      }
      if (mass < -0.6) return -5.4;

      float shape = fractalNoise(p * 0.099 + 8.2);
      float field = mass + (shape - 0.47) * 0.68;
      float ridge = 0.65 + 0.85 * fractalNoise(p * 0.15 + 13.7);
      return field > 0.0 ? 10.5 * (1.0 - exp(-field * ridge * 1.42)) : max(field * 9.0, -5.4);
    }

    float marchGround(float ground, float water) {
      float h = 12.0;
      float surface = max(ground, water);
      for (int i = 0; i < 7; ++i) {
        float distanceToSurface = h - surface;
        if (distanceToSurface < 0.008) break;
        h -= distanceToSurface * 0.84;
      }
      return h;
    }

    vec3 coastColor(vec2 p, float ground, float water, float depth, vec3 normal) {
      float time = uTime;
      if (ground > water) {
        float sandNoise = noise(p * 6.1 + 1.3);
        float sun = clamp(dot(normal, SUN), 0.0, 1.0);
        float vegetation = fractalNoise(p * 0.57 + 23.8);
        vec3 sand = mix(vec3(0.49, 0.47, 0.33), vec3(0.85, 0.80, 0.61), sandNoise);
        vec3 grass = mix(vec3(0.15, 0.25, 0.17), vec3(0.43, 0.49, 0.28), vegetation);
        vec3 forest = mix(vec3(0.065, 0.17, 0.13), vec3(0.23, 0.34, 0.20), noise(p * 3.0));
        vec3 land = mix(grass, forest, smoothstep(0.34, 0.64, vegetation));
        float rock = smoothstep(0.15, 0.63, 1.0 - normal.y) * smoothstep(2.5, 5.5, ground);
        land = mix(land, vec3(0.36, 0.34, 0.27) * (0.8 + sandNoise * 0.4), rock);
        land = mix(sand, land, smoothstep(0.10, 0.68, depth));
        return land * (0.60 + sun * 0.50) + vec3(0.015, 0.03, 0.032);
      }

      vec2 drift = vec2(time * 0.35, -time * 0.16);
      float broad = fractalNoise(p * 0.066 + vec2(2.0, 31.0));
      float chop = noise(p * vec2(1.7, 2.7) + drift);
      float swell = sin(dot(p, vec2(1.43, 2.27)) + noise(p * 0.48) * 4.3 + time * 1.93);
      float ripples = (0.5 + 0.5 * swell) * 0.56 + chop * 0.44;
      vec3 deep = mix(vec3(0.050, 0.218, 0.297), vec3(0.115, 0.397, 0.456), broad);
      vec3 shallow = mix(vec3(0.12, 0.46, 0.48), vec3(0.33, 0.68, 0.63), broad);
      vec3 ocean = mix(deep, shallow, 1.0 - smoothstep(0.0, 3.1, depth));
      ocean = mix(ocean, vec3(0.55, 0.70, 0.57), (1.0 - smoothstep(0.04, 0.55, depth)) * 0.44);
      ocean += (ripples - 0.50) * vec3(0.046, 0.085, 0.091);
      float whitecaps = smoothstep(0.88, 0.987, ripples) * smoothstep(0.52, 0.78, noise(p * 0.39 + drift * 0.4));
      ocean = mix(ocean, vec3(0.69, 0.83, 0.78), whitecaps * 0.23);
      if (depth >= 1.33) return ocean;

      float surfBand = 0.5 + 0.5 * sin(depth * 14.5 + chop * 3.4 - time * 2.8);
      float surf = (1.0 - smoothstep(0.04, 1.33, depth)) * smoothstep(0.41, 0.91, surfBand);
      surf *= smoothstep(0.25, 0.73, noise(p * 6.1 + 1.3) * 0.57 + chop * 0.43);
      return mix(ocean, vec3(0.86, 0.94, 0.85), surf * 0.90);
    }

    void main() {
      vec2 centered = gl_FragCoord.xy / uResolution - 0.5;
      vec2 world = uView.xy + centered * vec2(uView.z, -uView.w);
      float ground = landHeight(world);

    #ifdef DRAW_MINIMAP
      vec3 water = mix(vec3(0.065, 0.18, 0.22), vec3(0.19, 0.35, 0.35), smoothstep(-4.0, 0.0, ground));
      vec3 land = mix(vec3(0.68, 0.66, 0.47), vec3(0.32, 0.43, 0.30), smoothstep(0.0, 1.7, ground));
      pixel = vec4(mix(water, land, smoothstep(-0.19, 0.19, ground)), 1.0);
    #else
      vec2 slope = vec2(dFdx(ground), -dFdy(ground)) * uResolution / uView.zw;
      vec3 normal = normalize(vec3(-slope.x, 1.0, -slope.y));
      float water = sin(dot(world, vec2(0.67, 1.05)) + uTime * 1.2) * 0.038;
      float surface = marchGround(ground, water);
      vec3 color = coastColor(world, ground, water, abs(surface - min(ground, water)), normal);

      vec2 cloudPoint = world * vec2(0.046, 0.061) + vec2(uTime * 0.014, 9.7);
      float haze = smoothstep(0.53, 0.80, fractalNoise(cloudPoint));
      color = mix(color, vec3(0.84, 0.90, 0.87), haze * 0.45);
      pixel = vec4(clamp(color, 0.0, 1.0), 1.0);
    #endif
    }
  </script>
  <script>
    'use strict';

    const COAST_MAP = {
      name: '海岸',
      bounds: { minX: -480, maxX: 480, minZ: -360, maxZ: 360 },
      spawn: { x: 0, z: 0, heading: 0 },
      opponentSpawn: { x: 0, z: -63, heading: 0 }
    };
    const AIRCRAFT = [
      { name: 'MiG-23M', missile: 'R-60', maxMach: 2.5, maxOverload: 30 },
      { name: 'F-4E', missile: 'AIM-9E', maxMach: 2.5, maxOverload: 10 }
    ];
    const TAU = Math.PI * 2;
    const MAX_BANK = 55 * Math.PI / 180;
    const STEP = 1 / 120;
    const START_THROTTLE = 0.55;
    const START_SPEED = 695;
    const FLIGHT_SPEED_SCALE = 0.064;
    const MACH_SCALE = 340 * 3.6 * FLIGHT_SPEED_SCALE;
    const IR_LOCK = { range: 122, acquireAngle: 0.26, holdAngle: 0.39, time: 0.42 };
    const MISSILE_LIFETIME = 4.8;
    const AIRCRAFT_HIT_RADIUS = 5.4;
    const LOOK_AHEAD = 19;
    const CAMERA_FOLLOW = 1 - Math.exp(-STEP / 0.19);
    const FLIGHT_KEYS = new Set(['KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space']);
    const VERTEX_SOURCE = `#version 300 es
      void main() {
        vec2 corner = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
        gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);
      }`;

    function initialFlight(airframe, spawn = COAST_MAP.spawn) {
      return { ...spawn, airframe, bank: 0, throttle: START_THROTTLE, speed: START_SPEED, time: 0 };
    }

    function initialCamera(flight) {
      return {
        x: flight.x + Math.sin(flight.heading) * LOOK_AHEAD,
        z: flight.z - Math.cos(flight.heading) * LOOK_AHEAD
      };
    }

    function stepFlight(flight, throttleInput, turnInput, dt) {
      flight.throttle = Math.max(0, Math.min(1, flight.throttle + throttleInput * 0.48 * dt));
      const desiredBank = turnInput * MAX_BANK;
      flight.bank += (desiredBank - flight.bank) * (1 - Math.exp(-dt / 0.14));

      const bankLoad = (flight.bank / MAX_BANK) ** 2;
      const targetSpeed = 435 + flight.throttle * 470 - 32 * bankLoad;
      flight.speed += (targetSpeed - flight.speed) * (1 - Math.exp(-dt / 1.35));
      const turnRate = clamp(420 * Math.tan(flight.bank) / flight.speed, -1.16, 1.16);
      flight.heading = (flight.heading + turnRate * dt + TAU) % TAU;
      const distance = flight.speed * FLIGHT_SPEED_SCALE * dt;
      flight.x += Math.sin(flight.heading) * distance;
      flight.z -= Math.cos(flight.heading) * distance;
      flight.time += dt;
    }

    function clamp(value, lower, upper) {
      return Math.max(lower, Math.min(upper, value));
    }

    function bearing(from, to) {
      return Math.atan2(to.x - from.x, from.z - to.z);
    }

    function angleDelta(from, to) {
      return Math.atan2(Math.sin(to - from), Math.cos(to - from));
    }

    function initialDuel(airframe) {
      const opponent = initialFlight(1 - airframe, COAST_MAP.opponentSpawn);
      return {
        opponent,
        previousOpponent: { ...opponent },
        playerRack: { ammo: 2, armed: false, lock: 0, lastLaunch: -Infinity },
        opponentRack: { ammo: 2, armed: false, lock: 0, lastLaunch: -Infinity },
        missiles: [],
        result: null
      };
    }

    function updateLock(rack, plane, target, dt) {
      if (!rack.armed) return;
      const distance = Math.hypot(target.x - plane.x, target.z - plane.z);
      const angle = Math.abs(angleDelta(plane.heading, bearing(plane, target)));
      const angleLimit = rack.lock >= IR_LOCK.time ? IR_LOCK.holdAngle : IR_LOCK.acquireAngle;
      rack.lock = distance <= IR_LOCK.range && angle <= angleLimit ? Math.min(IR_LOCK.time, rack.lock + dt) : 0;
    }

    function launchMissile(duel, rack, plane, fromPlayer) {
      if (!rack.ammo || rack.lock < IR_LOCK.time) return;
      const x = plane.x + Math.sin(plane.heading) * 8.8;
      const z = plane.z - Math.cos(plane.heading) * 8.8;
      duel.missiles.push({
        fromPlayer, airframe: plane.airframe, heading: plane.heading,
        x, z, previousX: x, previousZ: z, bornAt: plane.time,
        speed: plane.speed * FLIGHT_SPEED_SCALE + 22,
        trail: [{ x, z }], nextTrailAt: plane.time + 0.055
      });
      rack.ammo--;
      rack.armed = false;
      rack.lock = 0;
      rack.lastLaunch = plane.time;
    }

    function missileContact(missile, target, previousTarget) {
      // Test the swept segment in the moving target's frame.
      const x = missile.previousX - previousTarget.x;
      const z = missile.previousZ - previousTarget.z;
      const dx = missile.x - target.x - x;
      const dz = missile.z - target.z - z;
      const along = clamp(-(x * dx + z * dz) / (dx * dx + dz * dz || 1), 0, 1);
      return (x + dx * along) ** 2 + (z + dz * along) ** 2 <= AIRCRAFT_HIT_RADIUS ** 2;
    }

    function stepMissiles(duel, flight, previousFlight, dt) {
      let playerHit = false;
      let opponentHit = false;
      for (let index = duel.missiles.length - 1; index >= 0; index--) {
        const missile = duel.missiles[index];
        if (flight.time - missile.bornAt >= MISSILE_LIFETIME) {
          duel.missiles.splice(index, 1);
          continue;
        }

        const target = missile.fromPlayer ? duel.opponent : flight;
        const previousTarget = missile.fromPlayer ? duel.previousOpponent : previousFlight;
        const weapon = AIRCRAFT[missile.airframe];
        const turnLimit = weapon.maxOverload * 0.095 * dt; // Arcade turn budget, scaled by the reference G rating.
        const desired = angleDelta(missile.heading, bearing(missile, target));
        missile.heading += clamp(desired, -turnLimit, turnLimit);
        missile.speed = Math.min(weapon.maxMach * MACH_SCALE, missile.speed + 260 * dt);
        missile.previousX = missile.x;
        missile.previousZ = missile.z;
        missile.x += Math.sin(missile.heading) * missile.speed * dt;
        missile.z -= Math.cos(missile.heading) * missile.speed * dt;

        if (missileContact(missile, target, previousTarget)) {
          if (missile.fromPlayer) opponentHit = true;
          else playerHit = true;
          duel.missiles.splice(index, 1);
          continue;
        }
        if (flight.time >= missile.nextTrailAt) {
          missile.trail.push({ x: missile.x, z: missile.z });
          if (missile.trail.length > 15) missile.trail.shift();
          missile.nextTrailAt = flight.time + 0.055;
        }
      }
      if (playerHit || opponentHit) duel.result = playerHit ? (opponentHit ? 'draw' : 'lost') : 'won';
    }

    function stepDuel(duel, flight, previousFlight, activate, dt) {
      const { opponent, opponentRack, playerRack } = duel;
      Object.assign(duel.previousOpponent, opponent);
      const activeOpponent = flight.time >= 3.6;
      const incoming = duel.missiles.some(missile => missile.fromPlayer && Math.hypot(missile.x - opponent.x, missile.z - opponent.z) < 43);
      const distance = Math.hypot(opponent.x - flight.x, opponent.z - flight.z);
      const desiredHeading = bearing(opponent, flight) + (distance < 19 ? 0.75 : 0);
      const turn = activeOpponent ? (incoming ? 1 : clamp(angleDelta(opponent.heading, desiredHeading) * 1.55, -1, 1)) : 0;
      const throttle = activeOpponent ? clamp((distance > 100 ? 0.68 : 0.53) - opponent.throttle, -1, 1) : 0;
      stepFlight(opponent, throttle, turn, dt);
      stepMissiles(duel, flight, previousFlight, dt);
      if (duel.result) return;

      updateLock(playerRack, flight, opponent, dt);
      if (activate && playerRack.ammo) {
        if (playerRack.armed) launchMissile(duel, playerRack, flight, true);
        else playerRack.armed = true;
      }

      if (activeOpponent && opponentRack.ammo && flight.time - opponentRack.lastLaunch >= 1.9) {
        opponentRack.armed = !incoming;
        if (incoming) opponentRack.lock = 0;
        updateLock(opponentRack, opponent, flight, dt);
        launchMissile(duel, opponentRack, opponent, false);
      }
      if (!playerRack.ammo && !opponentRack.ammo && !duel.missiles.length) duel.result = 'draw';
    }

    function lerp(start, end, fraction) {
      return start + (end - start) * fraction;
    }

    function interpolateFlight(display, previous, current, fraction) {
      display.x = lerp(previous.x, current.x, fraction);
      display.z = lerp(previous.z, current.z, fraction);
      display.heading = previous.heading + angleDelta(previous.heading, current.heading) * fraction;
      display.bank = lerp(previous.bank, current.bank, fraction);
      display.throttle = lerp(previous.throttle, current.throttle, fraction);
      display.time = lerp(previous.time, current.time, fraction);
      display.airframe = current.airframe;
    }

    const JET_ART = [
      {
        hull: new Path2D('M 0 -9.2 Q .7 -8.5 1.08 -6.2 L 1.28 -3.8 2.17 -3.38 2.62 -1.74 6.08 2.34 6.00 3.65 1.43 1.96 1.17 4.92 3.54 6.86 3.34 7.86 .92 7.01 .68 8.51 -.68 8.51 -.92 7.01 -3.34 7.86 -3.54 6.86 -1.17 4.92 -1.43 1.96 -6.00 3.65 -6.08 2.34 -2.62 -1.74 -2.17 -3.38 -1.28 -3.8 -1.08 -6.2 Q -.7 -8.5 0 -9.2 Z'),
        panel: new Path2D('M 1.66 -1.79 5.74 2.60 5.78 3.24 1.41 1.72 Z M -1.66 -1.79 -5.74 2.60 -5.78 3.24 -1.41 1.72 Z M -.69 3.64 .69 3.64 .63 7.74 -.63 7.74 Z'),
        nose: new Path2D('M 0 -8.98 Q .64 -8.35 1.01 -6.33 Q 0 -5.96 -1.01 -6.33 Q -.64 -8.35 0 -8.98 Z'),
        intakes: new Path2D('M 1.17 -3.43 1.94 -3.21 1.93 -2.37 1.23 -2.5 Z M -1.17 -3.43 -1.94 -3.21 -1.93 -2.37 -1.23 -2.5 Z'),
        canopy: new Path2D('M 0 -5.77 Q .62 -5.43 .64 -4.54 L .51 -3.61 Q 0 -3.35 -.51 -3.61 L -.64 -4.54 Q -.62 -5.43 0 -5.77 Z'),
        seams: new Path2D('M 1.72 -1.61 4.6 1.97 M -1.72 -1.61 -4.6 1.97 M 0 3.74 0 7.35 M -.56 -4.76 .56 -4.76'),
        base: '#a1b0ae', secondary: '#627c80', exhausts: [0], tail: 8.17
      },
      {
        hull: new Path2D('M 0 -9.6 Q .7 -9.1 1.06 -7.34 L 1.20 -4.24 1.92 -3.73 2.03 -2.56 5.18 .88 6.51 2.82 6.48 4.40 2.14 3.13 1.95 5.52 1.29 5.76 1.01 6.46 3.19 8.39 3.19 9.01 .59 8.86 0 9.48 -.59 8.86 -3.19 9.01 -3.19 8.39 -1.01 6.46 -1.29 5.76 -1.95 5.52 -2.14 3.13 -6.48 4.40 -6.51 2.82 -5.18 .88 -2.03 -2.56 -1.92 -3.73 -1.20 -4.24 -1.06 -7.34 Q -.7 -9.1 0 -9.6 Z'),
        panel: new Path2D('M -6.24 2.89 -5.16 1.14 -4.96 3.67 -6.22 4.06 Z M 6.24 2.89 5.16 1.14 4.96 3.67 6.22 4.06 Z M -4.84 1.04 -2.03 -2.10 -.49 -.44 -1.7 1.42 -3.53 2.94 -4.83 3.58 Z M .37 1.14 2.24 -.37 4.79 1.53 4.81 3.57 2.09 2.87 1.6 4.65 .37 4.12 Z M -1.58 4.46 1.58 4.46 1.68 5.36 -1.68 5.36 Z'),
        nose: new Path2D('M 0 -9.34 Q .68 -8.81 1.00 -7.20 L 1.10 -6.06 Q 0 -5.72 -1.10 -6.06 L -1.00 -7.20 Q -.68 -8.81 0 -9.34 Z'),
        intakes: new Path2D('M 1.24 -3.74 1.89 -3.51 1.98 -2.64 1.25 -2.76 Z M -1.24 -3.74 -1.89 -3.51 -1.98 -2.64 -1.25 -2.76 Z'),
        canopy: new Path2D('M 0 -5.89 Q .64 -5.61 .69 -4.61 L .64 -2.83 Q 0 -2.40 -.64 -2.83 L -.69 -4.61 Q -.64 -5.61 0 -5.89 Z'),
        seams: new Path2D('M -5.1 1.15 -4.93 3.68 M 5.1 1.15 4.93 3.68 M -.65 -4.67 .65 -4.67 M -.64 -3.60 .64 -3.60 M -.93 4.6 -.93 5.5 M .93 4.6 .93 5.5'),
        base: '#9c9a75', secondary: '#687451', exhausts: [-.78, .78], tail: 5.22
      }
    ];

    function drawJet(context, plane) {
      const art = JET_ART[plane.airframe];
      context.save();
      context.translate(plane.x, plane.z);
      context.rotate(plane.heading);
      context.scale(Math.cos(plane.bank * 0.78), 1);
      context.save();
      context.translate(1.1, 1.7);
      context.fillStyle = 'rgba(5, 18, 23, .25)';
      context.fill(art.hull);
      context.restore();
      context.fillStyle = art.base;
      context.strokeStyle = '#233237';
      context.lineWidth = 0.20;
      context.fill(art.hull);
      context.stroke(art.hull);
      context.fillStyle = art.secondary;
      context.fill(art.panel);
      context.fillStyle = '#34464a';
      context.fill(art.nose);
      context.fill(art.intakes);
      context.fillStyle = '#315461';
      context.fill(art.canopy);
      context.strokeStyle = '#b5c4be';
      context.lineWidth = 0.13;
      context.stroke(art.canopy);
      context.strokeStyle = '#41565a';
      context.stroke(art.seams);
      for (const x of art.exhausts) {
        context.fillStyle = '#26343a';
        context.fillRect(x - 0.44, art.tail - 0.66, 0.88, 0.96);
        context.fillStyle = plane.throttle > 0.75 ? '#f2ae70' : '#8d7762';
        context.fillRect(x - 0.31, art.tail + 0.03, 0.62, plane.throttle > 0.75 ? 0.66 : 0.22);
      }
      context.restore();
    }

    function drawMissile(context, missile, fraction) {
      const x = lerp(missile.previousX, missile.x, fraction);
      const z = lerp(missile.previousZ, missile.z, fraction);
      context.strokeStyle = missile.fromPlayer ? 'rgba(220, 240, 228, .59)' : 'rgba(249, 161, 119, .68)';
      context.lineWidth = 0.65;
      context.beginPath();
      for (const point of missile.trail) context.lineTo(point.x, point.z);
      context.lineTo(x, z);
      context.stroke();
      context.save();
      context.translate(x, z);
      context.rotate(missile.heading);
      context.fillStyle = '#f5efe1';
      context.fillRect(-0.32, -2.1, 0.64, 3.25);
      context.fillStyle = missile.fromPlayer ? '#f7d486' : '#ff8b69';
      context.fillRect(-0.37, 1.15, 0.74, 1.55);
      context.restore();
    }

    function drawLock(context, flight, target, rack, scale) {
      if (!rack.armed) return;
      const locked = rack.lock >= IR_LOCK.time;
      context.strokeStyle = locked ? '#abefbc' : '#eddba1';
      context.lineWidth = Math.max(0.25, 1 / scale);
      context.save();
      context.translate(flight.x, flight.z);
      context.rotate(flight.heading);
      context.beginPath();
      context.moveTo(-3.7, -20);
      context.lineTo(-9.7, -40);
      context.moveTo(3.7, -20);
      context.lineTo(9.7, -40);
      context.stroke();
      context.restore();
      if (!rack.lock) return;
      const size = 12 - 2 * rack.lock / IR_LOCK.time;
      context.beginPath();
      context.rect(target.x - size, target.z - size, size * 2, size * 2);
      context.stroke();
    }

    function drawDuel(context, width, height, viewWidth, viewHeight, camera, flight, opponent, duel, fraction) {
      const scaleX = width / viewWidth;
      const scaleY = height / viewHeight;
      context.resetTransform();
      context.clearRect(0, 0, width, height);
      context.setTransform(scaleX, 0, 0, scaleY, width / 2 - camera.x * scaleX, height / 2 - camera.z * scaleY);
      context.lineCap = 'round';
      context.lineJoin = 'round';
      for (const missile of duel.missiles) drawMissile(context, missile, fraction);
      for (const [plane, destroyed] of [[opponent, duel.result === 'won'], [flight, duel.result === 'lost']]) {
        if (destroyed) {
          context.beginPath();
          context.arc(plane.x, plane.z, 8, 0, TAU);
          context.fillStyle = 'rgba(255, 146, 86, .43)';
          context.fill();
        } else {
          drawJet(context, plane);
        }
      }
      if (duel.result) return;

      const enemyLabel = AIRCRAFT[opponent.airframe].name;
      context.font = `600 ${Math.max(2.45, 11 / scaleY)}px "Segoe UI", "Microsoft YaHei", sans-serif`;
      context.textAlign = 'center';
      context.lineWidth = Math.max(0.50, 2 / scaleY);
      context.strokeStyle = '#192e32';
      context.fillStyle = '#ffba90';
      context.strokeText(enemyLabel, opponent.x, opponent.z + 12.8);
      context.fillText(enemyLabel, opponent.x, opponent.z + 12.8);
      drawLock(context, flight, opponent, duel.playerRack, scaleY);
    }

    function createRenderer(canvas, effectsCanvas, mapCanvas, mapBounds) {
      const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
      const effects = effectsCanvas.getContext('2d');
      if (!gl) throw new Error('WebGL2 is unavailable.');
      if (!effects) throw new Error('The effects canvas is unavailable.');

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source.trim());
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(message);
        }
        return shader;
      }

      const vertex = compile(gl.VERTEX_SHADER, VERTEX_SOURCE);
      const fragmentSource = document.getElementById('terrain-fragment').textContent;

      function makePass(source) {
        const fragment = compile(gl.FRAGMENT_SHADER, source);
        const program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.deleteShader(fragment);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
        return {
          program,
          resolution: gl.getUniformLocation(program, 'uResolution'),
          view: gl.getUniformLocation(program, 'uView'),
          time: gl.getUniformLocation(program, 'uTime')
        };
      }

      const terrain = makePass(fragmentSource);
      gl.bindVertexArray(gl.createVertexArray());

      const terrainBuffer = gl.createFramebuffer();
      const terrainColor = gl.createRenderbuffer();

      let viewWidth;
      let viewHeight;
      let terrainWidth = 0;
      let terrainHeight = 0;
      let terrainQuality = 1;

      function allocateTerrainBuffer(width, height) {
        gl.bindRenderbuffer(gl.RENDERBUFFER, terrainColor);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, width, height);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, terrainBuffer);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, terrainColor);
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        if (status !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Could not allocate the terrain buffer.');
      }

      function drawMinimapTerrain() {
        const { minX, maxX, minZ, maxZ } = mapBounds;
        const width = mapCanvas.width;
        const height = Math.max(1, Math.round(width * (maxZ - minZ) / (maxX - minX)));
        mapCanvas.height = height;
        const context = mapCanvas.getContext('2d');
        const map = makePass(fragmentSource.replace('#version 300 es', '#version 300 es\n#define DRAW_MINIMAP'));

        allocateTerrainBuffer(width, height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, terrainBuffer);
        gl.useProgram(map.program);
        gl.viewport(0, 0, width, height);
        gl.uniform2f(map.resolution, width, height);
        gl.uniform4f(map.view, (minX + maxX) / 2, (minZ + maxZ) / 2, maxX - minX, maxZ - minZ);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        const pixels = new Uint8Array(width * height * 4);
        gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.useProgram(null);
        gl.deleteProgram(map.program);

        // WebGL starts at the bottom row. The minimap and world positions start at the north edge.
        const image = context.createImageData(width, height);
        const rowLength = width * 4;
        for (let row = 0; row < height; row++) {
          const sourceOffset = (height - 1 - row) * rowLength;
          image.data.set(pixels.subarray(sourceOffset, sourceOffset + rowLength), row * rowLength);
        }
        context.putImageData(image, 0, 0);
      }

      function resizeTerrain() {
        const scale = Math.min(0.78, Math.sqrt(365000 / (canvas.width * canvas.height))) * terrainQuality;
        const width = Math.max(1, Math.round(canvas.width * scale));
        const height = Math.max(1, Math.round(canvas.height * scale));
        if (width === terrainWidth && height === terrainHeight) return;

        allocateTerrainBuffer(width, height);
        terrainWidth = width;
        terrainHeight = height;
      }

      function resize() {
        const width = Math.max(canvas.clientWidth, 1);
        const height = Math.max(canvas.clientHeight, 1);
        const aspect = width / height;
        viewHeight = Math.max(176, 112 / aspect);
        viewWidth = viewHeight * aspect;
        const scale = Math.min(window.devicePixelRatio || 1, 1.25, Math.sqrt(950000 / (width * height)));
        const pixelWidth = Math.max(1, Math.round(width * scale));
        const pixelHeight = Math.max(1, Math.round(height * scale));
        if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
        if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
        if (effectsCanvas.width !== pixelWidth) effectsCanvas.width = pixelWidth;
        if (effectsCanvas.height !== pixelHeight) effectsCanvas.height = pixelHeight;
        resizeTerrain();
      }

      function reduceResolution() {
        if (terrainQuality <= 0.60) return;
        terrainQuality = Math.max(0.60, terrainQuality * 0.81);
        resizeTerrain();
      }

      function drawPass(pass, width, height, flight, camera) {
        gl.useProgram(pass.program);
        gl.viewport(0, 0, width, height);
        gl.uniform2f(pass.resolution, width, height);
        gl.uniform4f(pass.view, camera.x, camera.z, viewWidth, viewHeight);
        gl.uniform1f(pass.time, flight.time);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function draw(flight, camera, opponent, duel, fraction) {
        const { width, height } = canvas;
        gl.bindFramebuffer(gl.FRAMEBUFFER, terrainBuffer);
        drawPass(terrain, terrainWidth, terrainHeight, flight, camera);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.blitFramebuffer(0, 0, terrainWidth, terrainHeight, 0, 0, width, height, gl.COLOR_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);

        drawDuel(effects, width, height, viewWidth, viewHeight, camera, flight, opponent, duel, fraction);
      }

      drawMinimapTerrain();
      gl.deleteShader(vertex);
      resize();
      return { draw, resize, reduceResolution };
    }

    const canvas = document.getElementById('scene');
    const effectsCanvas = document.getElementById('effects');
    const aircraftSelect = document.getElementById('aircraft-select');
    const minimapCanvas = document.getElementById('minimap-terrain');
    const minimapMarker = document.getElementById('minimap-marker');
    const minimapTarget = document.getElementById('minimap-target');
    const minimapStatus = document.getElementById('minimap-status');
    document.getElementById('minimap-name').textContent = COAST_MAP.name;
    const pauseButton = document.getElementById('pause');
    const resetButton = document.getElementById('reset');
    const resumeButton = document.getElementById('resume');
    const message = document.getElementById('message');
    const messageTitle = document.getElementById('message-title');
    const messageDetail = document.getElementById('message-detail');
    const headingOutput = document.getElementById('heading');
    const speedOutput = document.getElementById('speed');
    const throttleOutput = document.getElementById('throttle');
    const throttleTrack = document.getElementById('throttle-track');
    const bankOutput = document.getElementById('bank-angle');
    const missileName = document.getElementById('missile-name');
    const ammoOutput = document.getElementById('missile-ammo');
    const seekerOutput = document.getElementById('seeker-status');
    const missileFeedback = document.getElementById('missile-feedback');
    const compass = document.getElementById('compass');
    const keycaps = document.querySelectorAll('[data-key]');
    const keys = new Set();

    let flight = initialFlight(Number(aircraftSelect.value));
    let duel = initialDuel(flight.airframe);
    let camera = initialCamera(flight);
    const previousFlight = { ...flight };
    const previousCamera = { ...camera };
    const displayFlight = { ...flight };
    const displayOpponent = { ...duel.opponent };
    const displayCamera = { ...camera };
    let renderer;
    let paused = false;
    let seekerRequested = false;
    let request = 0;
    let lastFrame = null;
    let accumulator = 0;
    let lastInstrumentsAt = -Infinity;
    let resolutionTime = 0;
    let frameCount = 0;
    let slowFrames = 0;

    function updateInstruments() {
      const degrees = 180 / Math.PI;
      const heading = Math.round(flight.heading * degrees) % 360;
      const bank = Math.round(flight.bank * degrees);
      headingOutput.value = `${String(heading).padStart(3, '0')}°`;
      speedOutput.value = String(Math.round(flight.speed));
      throttleOutput.value = String(Math.round(flight.throttle * 100));
      bankOutput.value = bank === 0 ? '0°' : `${bank < 0 ? '左' : '右'} ${Math.abs(bank)}°`;
      const { playerRack } = duel;
      const locked = playerRack.lock >= IR_LOCK.time;
      missileName.textContent = AIRCRAFT[flight.airframe].missile;
      ammoOutput.value = `${playerRack.ammo} 枚`;
      ammoOutput.toggleAttribute('data-empty', playerRack.ammo === 0);
      seekerOutput.value = locked ? '已锁定' : playerRack.armed ? (playerRack.lock ? '锁定中' : '搜索') : '待机';
      const incoming = duel.missiles.some(missile => !missile.fromPlayer);
      let feedback = '';
      if (incoming) feedback = '来袭导弹';
      else if (locked) feedback = '空格发射';
      else if (playerRack.armed) feedback = '机头指向对手';
      else if (flight.time - playerRack.lastLaunch < 0.65) feedback = '导弹已发射';
      if (missileFeedback.textContent !== feedback) missileFeedback.textContent = feedback;
      missileFeedback.toggleAttribute('data-danger', incoming);
      throttleTrack.style.setProperty('--throttle', flight.throttle);
      compass.style.setProperty('--tape-offset', `${-((flight.heading * degrees * 2.4) % 36)}px`);
    }

    function placeOnMinimap(marker, worldX, worldZ) {
      const { minX, maxX, minZ, maxZ } = COAST_MAP.bounds;
      const x = (worldX - minX) / (maxX - minX);
      const z = (worldZ - minZ) / (maxZ - minZ);
      marker.style.setProperty('--map-x', `${x * 100}%`);
      marker.style.setProperty('--map-z', `${z * 100}%`);
      return x >= 0 && x <= 1 && z >= 0 && z <= 1;
    }

    function updateMinimap(position, opponent) {
      const inBounds = placeOnMinimap(minimapMarker, position.x, position.z);
      minimapMarker.style.setProperty('--map-heading', `${position.heading}rad`);
      const status = inBounds ? '' : '地图外';
      if (minimapStatus.textContent !== status) minimapStatus.textContent = status;
      placeOnMinimap(minimapTarget, opponent.x, opponent.z);
      minimapTarget.hidden = duel.result === 'won';
    }

    function clearKeys() {
      keys.clear();
      seekerRequested = false;
      for (const keycap of keycaps) keycap.classList.remove('active');
    }

    function showMessage(title, detail, canResume) {
      messageTitle.textContent = title;
      messageDetail.textContent = detail;
      messageDetail.hidden = !detail;
      resumeButton.hidden = !canResume;
      message.hidden = false;
    }

    function showDuelResult() {
      clearKeys();
      updateInstruments();
      resumeButton.textContent = '再来一局';
      const title = { won: '击毁对手', lost: '本机被击毁', draw: '本轮平局' }[duel.result];
      showMessage(title, '按 R 重新开始。', true);
      resumeButton.focus();
    }

    function setPaused(value) {
      if (!renderer || duel.result) return;
      paused = value;
      clearKeys();
      lastFrame = null;
      pauseButton.querySelector('span').textContent = value ? '继续' : '暂停';
      pauseButton.querySelector('i').className = value ? 'icon icon-play' : 'icon icon-pause';
      if (value) {
        cancelAnimationFrame(request);
        updateInstruments();
        resumeButton.textContent = '继续训练';
        showMessage('训练暂停', '', true);
        resumeButton.focus();
      } else {
        resumeButton.blur();
        message.hidden = true;
        cancelAnimationFrame(request);
        request = requestAnimationFrame(frame);
      }
    }

    function resetFlight() {
      if (!renderer) return;
      flight = initialFlight(Number(aircraftSelect.value));
      duel = initialDuel(flight.airframe);
      camera = initialCamera(flight);
      Object.assign(previousFlight, flight);
      Object.assign(previousCamera, camera);
      accumulator = 0;
      updateInstruments();
      drawInterpolatedFrame();
      setPaused(false);
    }

    function drawInterpolatedFrame() {
      const fraction = duel.result ? 1 : accumulator / STEP;
      interpolateFlight(displayFlight, previousFlight, flight, fraction);
      interpolateFlight(displayOpponent, duel.previousOpponent, duel.opponent, fraction);
      displayCamera.x = lerp(previousCamera.x, camera.x, fraction);
      displayCamera.z = lerp(previousCamera.z, camera.z, fraction);
      renderer.draw(displayFlight, displayCamera, displayOpponent, duel, fraction);
      updateMinimap(displayFlight, displayOpponent);
    }

    function frame(now) {
      const elapsed = lastFrame === null ? 0 : (now - lastFrame) / 1000;
      const dt = Math.min(elapsed, 0.1);
      lastFrame = now;
      accumulator += dt;

      const throttleInput = Number(keys.has('KeyW')) - Number(keys.has('KeyS'));
      const turnInput = Number(keys.has('KeyD')) - Number(keys.has('KeyA'));
      while (accumulator >= STEP) {
        Object.assign(previousFlight, flight);
        Object.assign(previousCamera, camera);
        stepFlight(flight, throttleInput, turnInput, STEP);
        stepDuel(duel, flight, previousFlight, seekerRequested, STEP);
        seekerRequested = false;
        camera.x = lerp(camera.x, flight.x + Math.sin(flight.heading) * LOOK_AHEAD, CAMERA_FOLLOW);
        camera.z = lerp(camera.z, flight.z - Math.cos(flight.heading) * LOOK_AHEAD, CAMERA_FOLLOW);
        accumulator -= STEP;
        if (duel.result) break;
      }

      if (elapsed > 0) {
        resolutionTime += Math.min(elapsed, 0.15);
        frameCount += 1;
        slowFrames += Number(elapsed > 0.024);
        if (resolutionTime >= 0.85) {
          if (slowFrames > frameCount * 0.22) renderer.reduceResolution();
          resolutionTime = 0;
          frameCount = 0;
          slowFrames = 0;
        }
      }

      drawInterpolatedFrame();
      if (duel.result) {
        showDuelResult();
        return;
      }
      if (now - lastInstrumentsAt >= 50) {
        updateInstruments();
        lastInstrumentsAt = now;
      }
      request = requestAnimationFrame(frame);
    }

    function startRenderer() {
      try {
        renderer = createRenderer(canvas, effectsCanvas, minimapCanvas, COAST_MAP.bounds);
        effectsCanvas.hidden = false;
        aircraftSelect.disabled = false;
        pauseButton.disabled = false;
        resetButton.disabled = false;
        if (duel.result) {
          drawInterpolatedFrame();
          showDuelResult();
        } else setPaused(false);
      } catch (error) {
        console.error(error);
        aircraftSelect.disabled = true;
        pauseButton.disabled = true;
        resetButton.disabled = true;
        showMessage('无法开始试飞', '请用支持 WebGL2 的桌面浏览器打开此文件，并启用图形加速。', false);
      }
    }

    window.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey || event.target === aircraftSelect) return;
      if (FLIGHT_KEYS.has(event.code)) {
        if (event.code === 'Space' && event.target instanceof HTMLButtonElement && event.target.matches(':focus-visible')) return;
        event.preventDefault();
        if (!renderer || paused || duel.result) return;
        if (event.code === 'Space') {
          if (event.repeat) return;
          seekerRequested = true;
        }
        keys.add(event.code);
        document.querySelector(`[data-key="${event.code}"]`).classList.add('active');
      } else if (event.code === 'Escape' && !event.repeat) {
        event.preventDefault();
        setPaused(!paused);
      } else if (event.code === 'KeyR' && !event.repeat) {
        event.preventDefault();
        resetFlight();
      }
    });

    window.addEventListener('keyup', (event) => {
      if (!FLIGHT_KEYS.has(event.code)) return;
      keys.delete(event.code);
      document.querySelector(`[data-key="${event.code}"]`).classList.remove('active');
    });

    window.addEventListener('blur', clearKeys);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && renderer && !paused) setPaused(true);
    });
    window.addEventListener('resize', () => {
      if (!renderer) return;
      renderer.resize();
      if (paused || duel.result) drawInterpolatedFrame();
    });

    canvas.addEventListener('webglcontextlost', (event) => {
      event.preventDefault();
      cancelAnimationFrame(request);
      renderer = null;
      clearKeys();
      effectsCanvas.hidden = true;
      aircraftSelect.disabled = true;
      pauseButton.disabled = true;
      resetButton.disabled = true;
      showMessage('图形连接中断', '正在等待浏览器恢复画面。', false);
    });
    canvas.addEventListener('webglcontextrestored', startRenderer);
    pauseButton.addEventListener('click', () => setPaused(!paused));
    resumeButton.addEventListener('click', () => {
      if (duel.result) resetFlight();
      else setPaused(false);
    });
    resetButton.addEventListener('click', resetFlight);
    aircraftSelect.addEventListener('change', () => {
      aircraftSelect.blur();
      resetFlight();
    });

    updateInstruments();
    startRenderer();
  </script>
</body>
</html>
